name: Test Pandana stack
on:
  push:
    paths:
      - '.github/workflows/test-pandana.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 geopandas==1.0.1 pyarrow==17.0.0 pandana==0.7 pyrosm==0.6.2 pyroaring==0.4.5 scipy==1.14.1
          python - <<'PY'
          import pandana, pyrosm, pyroaring, geopandas, scipy, pandas, numpy
          print('pandana',pandana.__version__)
          print('pyrosm',pyrosm.__version__)
          print('pyroaring ok')
          PY
