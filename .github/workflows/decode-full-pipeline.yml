name: Decode packaged accessibility analysis
on:
  push:
    paths:
      - '.github/workflows/decode-full-pipeline.yml'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify analysis source package
        run: |
          mkdir -p out/source
          cat pipeline/full_pipeline.part.00 pipeline/full_pipeline.part.01 pipeline/full_pipeline.part.02 | base64 --decode > /tmp/full_pipeline.tar.gz
          echo 'b085883d03d1a3144f4d5cf9b016371f6d3495a0c893c8d07fe138ce9973c60a  /tmp/full_pipeline.tar.gz' | sha256sum -c -
          tar -xzf /tmp/full_pipeline.tar.gz -C out/source
          python -m py_compile out/source/prepare_inputs.py out/source/aggregate_outputs.py
          find out/source -maxdepth 1 -type f -printf '%f\t%s\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: decoded-accessibility-analysis-source
          path: out/source/
          compression-level: 6
