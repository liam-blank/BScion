name: New Jersey Transit accessible-service production

on:
  push:
    branches:
      - transit-service-gap-production-20260812
    paths:
      - '.github/workflows/data-pipeline.yml'
      - 'service_gap/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  accessible-service:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Record workflow run
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          state={
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'sha': os.environ['GITHUB_SHA'],
            'branch': os.environ['GITHUB_REF_NAME'],
            'status': 'running',
            'started_at': datetime.now(timezone.utc).isoformat(),
          }
          open('run_state.json','w').write(json.dumps(state,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run_state.json
          git commit -m "Record accessible-service workflow run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report available memory and storage
        run: |
          free -h
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install geospatial analysis environment
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install \
            'numpy>=1.26,<2' 'pandas>=2.2,<3' 'scipy>=1.13,<2' \
            'geopandas>=1.0,<2' 'shapely>=2.0,<3' 'pyogrio>=0.10,<1' \
            'pyarrow>=17' 'pyproj>=3.6,<4' 'pyrosm==0.13.1' \
            'matplotlib>=3.9,<4'
          python - <<'PY'
          import geopandas, pandas, numpy, scipy, pyrosm, shapely, pyarrow
          print('environment ready', geopandas.__version__, pandas.__version__, numpy.__version__, scipy.__version__, pyrosm.__version__)
          PY

      - name: Build block-scale accessible-service and service-gap analysis
        run: |
          mkdir -p out/service_gap work/service_gap
          /usr/bin/time -v python service_gap/run.py --work work/service_gap --out out/service_gap 2>&1 | tee out/service_gap/execution.log

      - name: Package analysis outputs
        if: always()
        run: |
          mkdir -p out/service_gap
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('out/service_gap')
          manifest=[]
          for p in sorted(root.rglob('*')):
            if p.is_file():
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              manifest.append({'file':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':h})
          (root/'artifact_manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
          cd out
          zip -r -9 ../New_Jersey_Accessible_Service_Analysis_Data.zip service_gap
          cd ..
          ls -lh New_Jersey_Accessible_Service_Analysis_Data.zip
          df -h

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-jersey-accessible-service-production-data
          path: |
            out/service_gap/
            New_Jersey_Accessible_Service_Analysis_Data.zip
          compression-level: 6
          retention-days: 30

      - name: Record workflow completion
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          try:
            state=json.load(open('run_state.json'))
          except Exception:
            state={}
          state.update({
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'sha': os.environ['GITHUB_SHA'],
            'branch': os.environ['GITHUB_REF_NAME'],
            'status': os.environ.get('JOB_STATUS','unknown'),
            'finished_at': datetime.now(timezone.utc).isoformat(),
          })
          open('run_state.json','w').write(json.dumps(state,indent=2))
          PY
          git add run_state.json
          git commit -m "Record accessible-service workflow completion ${GITHUB_RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
