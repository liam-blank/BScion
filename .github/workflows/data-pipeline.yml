name: Transit data pipeline
on:
  push:
    paths:
      - '.github/workflows/data-pipeline.yml'
      - 'pipeline/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  prepare-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Record run
        run: |
          printf '{"run_id": "%s", "run_attempt": "%s", "sha": "%s", "started_at": "%s", "stage": "prepare_accessibility"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > run_state.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run_state.json
          git commit -m "Record transit pipeline run $GITHUB_RUN_ID" || true
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install spatial analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2.1' pandas pyarrow scipy shapely pyproj pyogrio geopandas pyrosm
          python -m pip freeze > requirements-effective.txt
      - name: Build block, schedule, and network inputs
        env:
          OMP_NUM_THREADS: '4'
        run: python pipeline/run_prepare_accessibility.py
      - name: Preserve analysis inputs and reproducibility files
        if: always()
        run: |
          mkdir -p out/reproducibility out/prepared
          cp pipeline/feed_config.py pipeline/bounded_reach.cpp pipeline/run_prepare_accessibility.py requirements-effective.txt out/reproducibility/ || true
          for f in acs_2024_tracts.csv origins_all.parquet origins_connected.parquet stops_snapped.parquet calls_matched.parquet all_trips.parquet reachability.parquet; do
            test -f "work/full/prepared/$f" && cp "work/full/prepared/$f" out/prepared/
          done
          du -sh work/full/* || true
          find out -maxdepth 3 -type f -printf '%p %s\n' | sort > out/output_manifest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nj-accessibility-preparation-audit
          path: out/
          compression-level: 6
