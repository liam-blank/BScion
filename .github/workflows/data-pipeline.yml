name: New Jersey transit accessibility production build
on:
  push:
    branches:
      - accessible-service-final-20260812
    paths:
      - '.github/workflows/data-pipeline.yml'
      - 'pipeline/patch_full_analysis.py'
      - 'pipeline/full_pipeline.part.00'
      - 'pipeline/full_pipeline.part.01'
      - 'pipeline/full_pipeline.part.02'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  production-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Record production run metadata
        run: |
          mkdir -p out
          printf '{"run_id":"%s","run_attempt":"%s","sha":"%s","started_at":"%s","stage":"accessible_service_production"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > out/service_gap_run_state.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial and analytical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libspatialindex-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests 'numpy<2' 'pandas<3' 'scipy<2' 'shapely>=2.0' 'pyproj>=3.6' 'geopandas>=1.0' 'pyogrio>=0.10' 'pyarrow>=15' 'pyrosm==0.13.1' 'pyroaring>=1.0'
          python -m pip freeze > out/requirements-effective.txt
      - name: Restore, patch, and verify production source
        run: |
          rm -rf pipeline/full_analysis
          mkdir -p pipeline/full_analysis
          cat pipeline/full_pipeline.part.00 pipeline/full_pipeline.part.01 pipeline/full_pipeline.part.02 | base64 --decode > /tmp/full_pipeline.tar.gz
          echo 'b085883d03d1a3144f4d5cf9b016371f6d3495a0c893c8d07fe138ce9973c60a  /tmp/full_pipeline.tar.gz' | sha256sum -c -
          tar -xzf /tmp/full_pipeline.tar.gz -C pipeline/full_analysis
          python pipeline/patch_full_analysis.py
          python -m py_compile pipeline/full_analysis/prepare_inputs.py pipeline/full_analysis/aggregate_outputs.py
      - name: Download, validate, and prepare authoritative public inputs
        run: python pipeline/full_analysis/prepare_inputs.py
      - name: Build pedestrian-network reachability
        run: |
          g++ -O3 -std=c++17 -fopenmp pipeline/full_analysis/router.cpp -o /tmp/router
          NODE_COUNT=$(cat work/intermediate/node_count.txt)
          /tmp/router work/intermediate/edges.bin work/intermediate/origins.bin work/intermediate/stops.bin "$NODE_COUNT" 1200 work/intermediate/pairs 4
          cat work/intermediate/pairs_0.tsv work/intermediate/pairs_1.tsv work/intermediate/pairs_2.tsv work/intermediate/pairs_3.tsv | LC_ALL=C sort --parallel=4 -S 50% -n -k1,1 -k2,2 > work/intermediate/pairs_sorted.tsv
          wc -l work/intermediate/pairs_sorted.tsv
      - name: Deduplicate trips and calculate block accessibility
        run: |
          g++ -O3 -std=c++17 pipeline/full_analysis/metrics.cpp -o /tmp/metrics
          STOP_COUNT=$(cat work/intermediate/stop_count.txt)
          /tmp/metrics work/intermediate/pairs_sorted.tsv work/intermediate/events.bin work/intermediate/trips.bin "$STOP_COUNT" work/intermediate/block_metrics.csv work/intermediate/metrics_qa_pairs.csv
      - name: Aggregate to tracts, validate, and publish tables
        run: python pipeline/full_analysis/aggregate_outputs.py
      - name: Preserve reproducibility and audit files
        if: always()
        run: |
          mkdir -p out/reproducibility out/audit_intermediates
          cp pipeline/full_analysis/prepare_inputs.py pipeline/full_analysis/aggregate_outputs.py pipeline/full_analysis/router.cpp pipeline/full_analysis/metrics.cpp pipeline/patch_full_analysis.py out/reproducibility/ || true
          printf '%s\n' 'Python 3.11; GNU C++17; OpenMP; representative Tuesday 2026-08-18; representative Saturday 2026-08-22.' > out/reproducibility/ENVIRONMENT.txt
          for f in work/intermediate/acs_2024_tracts.csv work/intermediate/origins.csv work/intermediate/stops.csv work/intermediate/metrics_qa_pairs.csv; do test -f "$f" && cp "$f" out/audit_intermediates/; done
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt || true
          find out -type f -printf '%p\t%s\n' | sort > out/output_manifest.tsv || true
          df -h || true
          du -sh work out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nj-transit-accessibility-service-gap-analysis-final
          path: out/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
