name: New Jersey transit accessibility production build
on:
  push:
    branches:
      - transit-service-gap-final-20260812
    paths:
      - '.github/workflows/data-pipeline.yml'
      - 'pipeline/build_accessibility_production.py.gz.b64'
      - 'pipeline/bounded_reach.cpp'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  production-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Record production run
        run: |
          printf '{"run_id":"%s","run_attempt":"%s","sha":"%s","started_at":"%s","stage":"accessible_service_production"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > service_gap_run_state.json
          git config user.name github-actions[bot]
          git config user.email 4189828+github-actions[bot]@users.noreply.github.com
          git add service_gap_run_state.json
          git commit -m "Record accessible-service production run $GITHUB_RUN_ID" || true
          git push origin HEAD:transit-service-gap-final-20260812
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial and analytical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libspatialindex-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'numpy<2' 'pandas<3' 'scipy<2' 'shapely>=2.0' 'pyproj>=3.6' 'geopandas>=1.0' 'pyogrio>=0.10' 'pyarrow>=15' 'pyrosm==0.13.1' 'pyroaring>=1.0'
      - name: Restore production source
        run: |
          base64 -d pipeline/build_accessibility_production.py.gz.b64 | gzip -d > pipeline/build_accessibility_production.py
          python -m py_compile pipeline/build_accessibility_production.py
      - name: Execute block-scale network accessibility analysis
        run: python pipeline/build_accessibility_production.py
      - name: Inventory outputs
        if: always()
        run: |
          find out -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort || true
          df -h || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nj-transit-accessible-service-production-data
          path: out/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
