name: Transit data pipeline
on:
  push:
    paths:
      - '.github/workflows/data-pipeline.yml'
      - 'pipeline/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  network-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Record run
        run: |
          printf '{"run_id": "%s", "run_attempt": "%s", "sha": "%s", "started_at": "%s", "stage": "network_test"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > run_state.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run_state.json
          git commit -m "Record transit pipeline run $GITHUB_RUN_ID" || true
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyrosm geopandas pyarrow
      - name: Download and inspect OSM, Census blocks, and LODES
        run: python pipeline/test_network.py
      - uses: actions/upload-artifact@v4
        with:
          name: nj-network-data-test
          path: out/
          compression-level: 6
